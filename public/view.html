<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Read paste</title>
<style>
  :root {
    color-scheme: light;
    --canvas: #f2f3f0;
    --paper: #fff;
    --ink: #182435;
    --muted: #546477;
    --line: #d8dfe5;
    --control: #8593a3;
    --accent: #214fb8;
    --accent-hover: #183e97;
    --tint: #eff4ff;
    --editor: #18263b;
    --editor-edge: #354962;
    --editor-text: #f2f6fc;
    --editor-muted: #aabbd0;
    --danger: #9c3032;
    --warning: #79501a;
    --mono: ui-monospace, Consolas, monospace;
  }
  html { overflow-y: scroll; }
  @supports (scrollbar-gutter: stable) {
    html { overflow-y: auto; scrollbar-gutter: stable; }
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font: 1rem/1.55 system-ui, sans-serif; }
  main { width: min(calc(100% - 48px), 56rem); margin: clamp(36px, 7vh, 80px) auto 40px; }
  .masthead { margin-bottom: 28px; }
  h1 { margin: 0; font-size: clamp(2.25rem, 5vw, 3.25rem); font-weight: 650; letter-spacing: -.04em; line-height: 1.08; }
  .masthead p { max-width: 48ch; margin: 10px 0 0; color: var(--muted); }
  .panel { min-width: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 12px 32px -24px #18243566; }
  button, input, select, textarea { font: inherit; }
  :where(button, input, select, textarea, a, summary):focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  a { color: var(--accent); text-underline-offset: .18em; }
  .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 16px; border: 1px solid transparent; border-radius: 8px; background: var(--accent); color: var(--paper); font-size: .875rem; font-weight: 650; text-decoration: none; white-space: nowrap; cursor: pointer; }
  .button:hover:not(:disabled) { background: var(--accent-hover); }
  .button.secondary { border-color: var(--control); background: var(--paper); color: var(--ink); }
  .button.secondary:hover:not(:disabled) { background: var(--tint); }
  .button:disabled { opacity: .75; cursor: wait; }
  .bp-spinner { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }
  .field { display: grid; gap: 6px; min-width: 0; }
  .field > label { font-size: .875rem; font-weight: 650; }
  .optional { color: var(--muted); font-weight: 400; }
  .input { width: 100%; min-height: 44px; padding: 8px 10px; border: 1px solid var(--control); border-radius: 8px; background: var(--paper); color: var(--ink); }
  ::placeholder { color: var(--muted); opacity: 1; }
  .note { margin: 0; font-size: .875rem; color: var(--muted); }
  .note--warn { color: var(--warning); }
  .err { margin: 0; color: var(--danger); }
  @media (max-width: 40rem) {
    main { width: calc(100% - 32px); margin-top: 32px; }
    .masthead { margin-bottom: 22px; }
  }
  @media (prefers-reduced-motion: reduce) { .bp-spinner { animation: none; } }

  .reader { max-width: 40rem; }
  .unlock { display: flex; align-items: end; flex-wrap: wrap; gap: 12px; padding: 20px; }
  .unlock .field { flex: 1 1 14rem; }
  #body:not(:empty) { margin-top: 20px; }
  #body > .err { font-size: .875rem; }
  .page-footer { display: flex; justify-content: flex-end; margin-top: 14px; }
  .source-link { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; margin: -6px -6px -6px 0; border-radius: 6px; color: var(--muted); }
  .source-link:hover, .source-link:focus-visible { color: var(--ink); background: #0000000a; }
  .source-link svg { width: 20px; height: 20px; fill: currentColor; }
  .readout { overflow: hidden; }
  .readout-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; }
  .readout-bar h2 { margin: 0; font-size: .875rem; }
  .readout-source { display: flex; max-height: 65vh; overflow: auto; background: var(--editor); color: var(--editor-text); color-scheme: dark; font: .9375rem/1.65 var(--mono); }
  .readout-source pre { margin: 0; padding: 16px; font: inherit; white-space: pre; tab-size: 4; }
  .readout-source .line-numbers { position: sticky; left: 0; flex: none; padding-inline: 10px; border-right: 1px solid var(--editor-edge); background: var(--editor); color: var(--editor-muted); text-align: right; user-select: none; }
  .file-card { display: grid; gap: 6px; padding: 20px; }
  .file-card p { margin: 0; }
  .file-name { font: 650 1.0625rem/1.4 var(--mono); overflow-wrap: anywhere; }
  @media (max-width: 40rem) { .unlock { padding: 16px; } }
</style>
</head>
<body>
<main class="reader">
  <header class="masthead">
    <h1>Read paste</h1>
    <p>Decrypt this paste in your browser.</p>
  </header>

  <div class="unlock panel">
    <div class="field">
      <label for="pw">Password <span class="optional">(if set)</span></label>
      <input id="pw" type="password" class="input" placeholder="Leave blank if none was set" autocomplete="off">
    </div>
    <button id="go" class="button" type="button">Decrypt</button>
  </div>
  <div id="body" aria-live="polite"></div>
  <footer class="page-footer note">
    <a class="source-link" href="https://github.com/Yuchenhui/khepri-secure-paste" target="_blank" rel="noreferrer" aria-label="Source on GitHub" title="Source on GitHub">
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
  </footer>
</main>

<script src="/view.js"></script>
</body>
</html>
