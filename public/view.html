<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>khepri &middot; read paste</title>
<style>
  :root {
    --bg:      #0f1419;
    --surface: #161d24;
    --sunk:    #101720;
    --border:  #232d36;
    --fg:      #e6edf3;
    --muted:   #8b98a5;
    --accent:  #4fd1c5;
    --danger:  #e57373;

    --s1: 4px;  --s2: 8px;  --s3: 12px;
    --s4: 16px; --s5: 24px; --s6: 32px;
    --r: 6px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: var(--s6) var(--s4);
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  main { width: 100%; max-width: 42rem; }

  h1 {
    margin: 0 0 var(--s5);
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  h1 .dot { color: var(--accent); }

  input[type=password], input[type=text] {
    width: 100%;
    padding: var(--s3);
    background: var(--sunk);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: var(--r);
    font-family: var(--mono);
    font-size: 13px;
    transition: border-color 120ms ease;
  }
  input::placeholder { color: #5c6a76; }
  input:hover { border-color: #2e3a45; }
  input:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79, 209, 197, 0.14);
  }

  .field { margin-bottom: var(--s4); }
  .field > label {
    display: block;
    margin-bottom: var(--s2);
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
  }

  button {
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    padding: 9px var(--s4);
    border: 0;
    border-radius: var(--r);
    cursor: pointer;
    transition: filter 120ms ease, opacity 120ms ease;
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:active:not(:disabled) { filter: brightness(0.94); }
  button:disabled { opacity: 0.55; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .primary { background: var(--accent); color: #0b1116; }
  .ghost { background: transparent; color: var(--fg); border: 1px solid var(--border); }
  .ghost:hover:not(:disabled) { border-color: #34414d; filter: none; background: var(--surface); }

  #body { margin-top: var(--s5); }

  .msg { font-size: 13px; color: var(--muted); margin: 0; }
  .err { font-size: 13px; color: var(--danger); margin: 0; }

  pre {
    margin: 0;
    padding: var(--s4);
    background: var(--sunk);
    border: 1px solid var(--border);
    border-radius: var(--r);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.65;
    white-space: pre-wrap;      /* keep newlines, wrap long lines */
    word-break: break-all;
    max-height: 65vh;
    overflow: auto;
  }

  .actions { margin-top: var(--s3); display: flex; gap: var(--s2); }

  @media (max-width: 480px) {
    body { padding: var(--s5) var(--s3); }
  }
</style>
</head>
<body>
<main>
  <h1>khepri <span class="dot">&middot;</span> read paste</h1>

  <div class="field">
    <label for="pw">Password (empty if none was set)</label>
    <input id="pw" type="password" placeholder="Password" autocomplete="off">
  </div>

  <button id="go" class="primary">Decrypt</button>

  <div id="body">
    <p class="msg">This link works once and is destroyed on read.</p>
  </div>
</main>

<script>
'use strict';

// The paste id is in the query string (sent to the server).
// The key is in the fragment (never sent to the server).
const id = location.search.slice(1);
const frag = decodeURIComponent(location.hash.slice(1));

function b64uToBytes(s) {
  const b64 = s.replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64 + '='.repeat((4 - b64.length % 4) % 4));
  const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
}

function show(html, cls) {
  const p = document.createElement('p');
  p.className = cls;
  p.textContent = html;             // textContent: no HTML injection
  const b = $('body');
  b.innerHTML = '';
  b.appendChild(p);
}

const $ = (x) => document.getElementById(x);

let plaintext = '';

async function decrypt() {
  const btn = $('go');
  if (!id || !frag) { show('Malformed link: missing id or key.', 'err'); return; }

  btn.disabled = true;
  btn.textContent = 'Decrypting…';

  let d;
  try {
    const r = await fetch('/api/paste/' + id);
    if (!r.ok) {
      show('Link not found, expired, or already read.', 'err');
      return;
    }
    d = await r.json();
  } catch {
    show('Network error.', 'err');
    return;
  }

  const password = $('pw').value;

  try {
    const enc = new TextEncoder();
    const keyBytes = b64uToBytes(frag);
    const salt = b64uToBytes(d.salt);
    // Same construction as the sender: random bytes ++ password.
    const material = new Uint8Array(keyBytes.length + password.length);
    material.set(keyBytes, 0);
    material.set(enc.encode(password), keyBytes.length);

    const km = await crypto.subtle.importKey('raw', material, 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt, iterations:d.iterations, hash:'SHA-256' },
      km, { name:'AES-GCM', length:256 }, false, ['decrypt']);

    // AES-GCM authenticates: wrong password or tampered id fails here.
    const pt = await crypto.subtle.decrypt(
      { name:'AES-GCM', iv:b64uToBytes(d.iv), additionalData:b64uToBytes(d.adata) },
      key, b64uToBytes(d.ct));

    plaintext = new TextDecoder().decode(pt);

    const pre = document.createElement('pre');
    pre.textContent = plaintext;     // textContent: every newline survives

    const copy = document.createElement('button');
    copy.className = 'ghost';
    copy.textContent = 'Copy';
    copy.onclick = async () => {
      try { await navigator.clipboard.writeText(plaintext); }
      catch {
        const ta = document.createElement('textarea');
        ta.value = plaintext;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      copy.textContent = 'Copied';
      setTimeout(() => { copy.textContent = 'Copy'; }, 1400);
    };

    const wrap = document.createElement('div');
    wrap.className = 'actions';
    wrap.appendChild(copy);

    const b = $('body');
    b.innerHTML = '';
    b.appendChild(pre);
    b.appendChild(wrap);
  } catch {
    show('Wrong password or corrupted content.', 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Decrypt';
  }
}

$('go').onclick = decrypt;
// Enter in the password field submits.
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') decrypt(); });
$('pw').focus();
</script>
</body>
</html>
