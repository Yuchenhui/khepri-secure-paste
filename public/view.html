<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>khepri &middot; read paste</title>
<style>
  :root { --bg:#12181f; --fg:#d5dbe1; --acc:#4da3a3; --bd:#2a343f; }
  body { background:var(--bg); color:var(--fg); font:14px/1.5 system-ui,sans-serif;
         margin:0; display:flex; justify-content:center; padding:32px 16px; }
  main { width:100%; max-width:680px; }
  h1 { font-size:18px; margin:0 0 16px; color:var(--acc); }
  #pw { width:100%; box-sizing:border-box; background:#0d1218; color:var(--fg);
        border:1px solid var(--bd); border-radius:4px; padding:9px; margin-bottom:10px; }
  button { background:var(--acc); color:#0d1218; border:0; border-radius:4px;
           padding:9px 18px; font-size:14px; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  #body { margin-top:16px; }
  pre { background:#0d1218; border:1px solid var(--bd); border-radius:4px; padding:12px;
        white-space:pre-wrap; word-break:break-all; font:13px/1.5 ui-monospace,monospace;
        max-height:60vh; overflow:auto; margin:0; }
  .msg { color:#7d8a96; font-size:13px; }
  .err { color:#c05c5c; }
</style>
</head>
<body>
<main>
  <h1>khepri &middot; read paste</h1>
  <input id="pw" type="password" placeholder="Password (empty if none was set)" autocomplete="off">
  <button id="go">Decrypt</button>
  <div id="body"><p class="msg">This link works once and is destroyed on read.</p></div>
</main>
<script>
// The paste id is in the query string (sent to the server).
// The key is in the fragment (never sent to the server).
const id = location.search.slice(1);
const frag = decodeURIComponent(location.hash.slice(1));

function b64uToBytes(s) {
  const b64 = s.replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64 + '='.repeat((4 - b64.length % 4) % 4));
  const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
}

document.getElementById('go').onclick = async () => {
  const body = document.getElementById('body');
  if (!id || !frag) {
    body.innerHTML = '<p class="err">Malformed link: missing id or key.</p>';
    return;
  }

  let d;
  try {
    const r = await fetch('/api/paste/' + id);
    if (!r.ok) {
      body.innerHTML = '<p class="err">Link not found, expired, or already read.</p>';
      return;
    }
    d = await r.json();
  } catch {
    body.innerHTML = '<p class="err">Network error.</p>';
    return;
  }

  const password = document.getElementById('pw').value;

  try {
    const enc = new TextEncoder();
    const keyBytes = b64uToBytes(frag);
    const salt = b64uToBytes(d.salt);
    // Same construction as the sender: random bytes ++ password.
    const material = new Uint8Array(keyBytes.length + password.length);
    material.set(keyBytes, 0);
    material.set(enc.encode(password), keyBytes.length);

    const km = await crypto.subtle.importKey('raw', material, 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt, iterations:d.iterations, hash:'SHA-256' },
      km, { name:'AES-GCM', length:256 }, false, ['decrypt']);

    // AES-GCM authenticates: a wrong password or a tampered id fails here.
    const pt = await crypto.subtle.decrypt(
      { name:'AES-GCM', iv:b64uToBytes(d.iv), additionalData:b64uToBytes(d.adata) },
      key, b64uToBytes(d.ct));

    const pre = document.createElement('pre');
    pre.textContent = new TextDecoder().decode(pt);  // textContent: newlines intact
    body.innerHTML = '';
    body.appendChild(pre);
  } catch (e) {
    body.innerHTML = '<p class="err">Wrong password or corrupted content.</p>';
  }
};
</script>
</body>
</html>
