<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Read paste</title>
<style>
  :root {
    color-scheme: light;
    --canvas: #f2f3f0;
    --paper: #fff;
    --ink: #182435;
    --muted: #546477;
    --line: #d8dfe5;
    --control: #8593a3;
    --accent: #214fb8;
    --accent-hover: #183e97;
    --tint: #eff4ff;
    --editor: #18263b;
    --editor-edge: #354962;
    --editor-text: #f2f6fc;
    --editor-muted: #aabbd0;
    --danger: #9c3032;
    --warning: #79501a;
    --mono: ui-monospace, Consolas, monospace;
  }
  html { overflow-y: scroll; }
  @supports (scrollbar-gutter: stable) {
    html { overflow-y: auto; scrollbar-gutter: stable; }
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font: 1rem/1.55 system-ui, sans-serif; }
  main { width: min(calc(100% - 48px), 56rem); margin: clamp(36px, 7vh, 80px) auto 40px; }
  .masthead { margin-bottom: 28px; }
  h1 { margin: 0; font-size: clamp(2.25rem, 5vw, 3.25rem); font-weight: 650; letter-spacing: -.04em; line-height: 1.08; }
  .masthead p { max-width: 48ch; margin: 10px 0 0; color: var(--muted); }
  .panel { min-width: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 12px 32px -24px #18243566; }
  button, input, select, textarea { font: inherit; }
  :where(button, input, select, textarea, a, summary):focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  a { color: var(--accent); text-underline-offset: .18em; }
  .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 16px; border: 1px solid transparent; border-radius: 8px; background: var(--accent); color: var(--paper); font-size: .875rem; font-weight: 650; text-decoration: none; white-space: nowrap; cursor: pointer; }
  .button:hover:not(:disabled) { background: var(--accent-hover); }
  .button.secondary { border-color: var(--control); background: var(--paper); color: var(--ink); }
  .button.secondary:hover:not(:disabled) { background: var(--tint); }
  .button:disabled { opacity: .75; cursor: wait; }
  .bp-spinner { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }
  .field { display: grid; gap: 6px; min-width: 0; }
  .field > label { font-size: .875rem; font-weight: 650; }
  .optional { color: var(--muted); font-weight: 400; }
  .input { width: 100%; min-height: 44px; padding: 8px 10px; border: 1px solid var(--control); border-radius: 8px; background: var(--paper); color: var(--ink); }
  ::placeholder { color: var(--muted); opacity: 1; }
  .note { margin: 0; font-size: .875rem; color: var(--muted); }
  .note--warn { color: var(--warning); }
  .err { margin: 0; color: var(--danger); }
  @media (max-width: 40rem) {
    main { width: calc(100% - 32px); margin-top: 32px; }
    .masthead { margin-bottom: 22px; }
  }
  @media (prefers-reduced-motion: reduce) { .bp-spinner { animation: none; } }

  .reader { max-width: 40rem; }
  .unlock { display: flex; align-items: end; flex-wrap: wrap; gap: 12px; padding: 20px; }
  .unlock .field { flex: 1 1 14rem; }
  #body:not(:empty) { margin-top: 20px; }
  #body > .err { font-size: .875rem; }
  .page-footer { margin-top: 14px; }
  .source-link { color: var(--muted); }
  .readout { overflow: hidden; }
  .readout-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; }
  .readout-bar h2 { margin: 0; font-size: .875rem; }
  .readout-source { display: flex; max-height: 65vh; overflow: auto; background: var(--editor); color: var(--editor-text); color-scheme: dark; font: .9375rem/1.65 var(--mono); }
  .readout-source pre { margin: 0; padding: 16px; font: inherit; white-space: pre; tab-size: 4; }
  .readout-source .line-numbers { position: sticky; left: 0; flex: none; padding-inline: 10px; border-right: 1px solid var(--editor-edge); background: var(--editor); color: var(--editor-muted); text-align: right; user-select: none; }
  .file-card { display: grid; gap: 6px; padding: 20px; }
  .file-card p { margin: 0; }
  .file-name { font: 650 1.0625rem/1.4 var(--mono); overflow-wrap: anywhere; }
  @media (max-width: 40rem) { .unlock { padding: 16px; } }
</style>
</head>
<body>
<main class="reader">
  <header class="masthead">
    <h1>Read paste</h1>
    <p>Decrypt this paste in your browser.</p>
  </header>

  <div class="unlock panel">
    <div class="field">
      <label for="pw">Password <span class="optional">(if set)</span></label>
      <input id="pw" type="password" class="input" placeholder="Leave blank if none was set" autocomplete="off">
    </div>
    <button id="go" class="button" type="button">Decrypt</button>
  </div>
  <div id="body" aria-live="polite"></div>
  <footer class="page-footer note">
    <a class="source-link" href="https://github.com/Yuchenhui/khepri-secure-paste" target="_blank" rel="noreferrer">Source on GitHub</a>
  </footer>
</main>

<script>
'use strict';

// The paste id is in the query string (sent to the server).
// The key is in the fragment (never sent to the server).
const id = location.search.slice(1);
const frag = location.hash.slice(1);
const FILE_MARKER = 'KHEPRI-FILE 1';

const $ = (x) => document.getElementById(x);

function b64uToBytes(s) {
  const b64 = s.replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64 + '='.repeat((4 - b64.length % 4) % 4));
  const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
}

// File body: marker line, base64url JSON metadata line, base64 payload.
function parseFilePayload(text) {
  const head = FILE_MARKER + '\n';
  if (!text.startsWith(head)) return null;
  const metaEnd = text.indexOf('\n', head.length);
  if (metaEnd < 0) return null;
  let meta;
  try {
    meta = JSON.parse(new TextDecoder().decode(b64uToBytes(text.slice(head.length, metaEnd))));
  } catch { return null; }
  let bytes;
  try {
    bytes = b64uToBytes(text.slice(metaEnd + 1).replace(/\s+/g, ''));
  } catch { return null; }
  return {
    name: typeof meta.name === 'string' && meta.name ? meta.name : 'download',
    type: typeof meta.type === 'string' ? meta.type : '',
    size: bytes.length,
    bytes,
  };
}

function formatBytes(n) {
  return n < 1024 ? n + ' B' : (n / 1024).toFixed(n < 10 * 1024 ? 1 : 0) + ' KB';
}

function fileReadout(file) {
  const url = URL.createObjectURL(new Blob([file.bytes], { type: file.type || 'application/octet-stream' }));

  const heading = document.createElement('h2');
  heading.textContent = 'Decrypted file';
  const save = document.createElement('a');
  save.className = 'button';
  save.href = url;
  save.download = file.name;
  save.textContent = 'Download';
  const bar = document.createElement('header');
  bar.className = 'readout-bar';
  bar.append(heading, save);

  const name = document.createElement('p');
  name.className = 'file-name';
  name.textContent = file.name;
  const meta = document.createElement('p');
  meta.className = 'note';
  meta.textContent = formatBytes(file.size) + (file.type ? ' · ' + file.type : '');
  const card = document.createElement('div');
  card.className = 'file-card';
  card.append(name, meta);

  const section = document.createElement('section');
  section.className = 'panel readout';
  section.append(bar, card);
  return section;
}

function show(text, cls) {
  const p = document.createElement('p');
  p.className = cls;
  p.textContent = text;
  const b = $('body');
  b.replaceChildren(p);
}

function makeSpinner() {
  const sp = document.createElement('span');
  sp.className = 'bp-spinner';
  sp.setAttribute('aria-hidden', 'true');
  return sp;
}

async function decrypt() {
  const btn = $('go');
  if (btn.disabled) return;
  if (!/^[0-9a-f]{16}$/.test(id) || !/^[A-Za-z0-9_-]{43}$/.test(frag)) {
    show('Malformed link: missing or invalid ID or key.', 'err');
    return;
  }

  btn.disabled = true;
  btn.setAttribute('aria-busy', 'true');
  btn.textContent = 'Decrypting';
  btn.prepend(makeSpinner());

  try {
    let d;
    try {
      const r = await fetch('/api/paste/' + id);
      if (!r.ok) { show('Link not found, expired, or already read.', 'err'); return; }
      d = await r.json();
    } catch {
      show('Network error.', 'err');
      return;
    }

    const enc = new TextEncoder();
    const passwordBytes = enc.encode($('pw').value);
    const keyBytes = b64uToBytes(frag);
    const salt = b64uToBytes(d.salt);
    // Same construction as the sender: random bytes ++ password.
    const material = new Uint8Array(keyBytes.length + passwordBytes.length);
    material.set(keyBytes, 0);
    material.set(passwordBytes, keyBytes.length);

    const km = await crypto.subtle.importKey('raw', material, 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt, iterations:d.iterations, hash:'SHA-256' },
      km, { name:'AES-GCM', length:256 }, false, ['decrypt']);

    const proof = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64uToBytes(d.claimIv), additionalData: enc.encode('claim:' + id) },
      key, b64uToBytes(d.claim));
    const encodedProof = btoa(String.fromCharCode(...new Uint8Array(proof)))
      .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

    let envelope;
    try {
      const r = await fetch('/api/paste/' + id, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ proof: encodedProof }),
      });
      if (!r.ok) { show('Paste expired, was already read, or is locked to another IP.', 'err'); return; }
      envelope = await r.json();
    } catch {
      show('Could not retrieve the paste. If it was set to burn, it may have been consumed.', 'err');
      return;
    }

    const pt = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64uToBytes(envelope.iv), additionalData: enc.encode(id) },
      key, b64uToBytes(envelope.ct));

    const plaintext = new TextDecoder().decode(pt);

    const file = parseFilePayload(plaintext);
    if (file) {
      $('body').replaceChildren(fileReadout(file));
      return;
    }

    const pre = document.createElement('pre');
    pre.textContent = plaintext;   // textContent: every newline survives
    const numbers = document.createElement('pre');
    numbers.className = 'line-numbers';
    numbers.setAttribute('aria-hidden', 'true');
    numbers.textContent = Array.from({ length: plaintext.split('\n').length }, (_, i) => i + 1).join('\n');

    const source = document.createElement('div');
    source.className = 'readout-source';
    source.tabIndex = 0;
    source.setAttribute('role', 'region');
    source.setAttribute('aria-label', 'Decrypted text');
    source.append(numbers, pre);

    const copy = document.createElement('button');
    copy.className = 'button secondary';
    copy.type = 'button';
    copy.textContent = 'Copy';
    copy.onclick = async () => {
      try { await navigator.clipboard.writeText(plaintext); }
      catch {
        const ta = document.createElement('textarea');
        ta.value = plaintext;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      copy.textContent = 'Copied';
      setTimeout(() => { copy.textContent = 'Copy'; }, 1400);
    };

    const readout = document.createElement('section');
    readout.className = 'panel readout';
    const bar = document.createElement('header');
    bar.className = 'readout-bar';
    const heading = document.createElement('h2');
    heading.textContent = 'Decrypted content';
    bar.append(heading, copy);
    readout.append(bar, source);
    $('body').replaceChildren(readout);
  } catch {
    show('Wrong password or corrupted content.', 'err');
  } finally {
    btn.disabled = false;
    btn.removeAttribute('aria-busy');
    btn.textContent = 'Decrypt';
  }
}

$('go').onclick = decrypt;
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') decrypt(); });
$('pw').focus();
</script>
</body>
</html>
