    font-family: var(--font-mono);
    font-size: var(--text-mono-sm);
    line-height: var(--text-mono-sm--line-height);

<body>
<main>
  <header class="masthead">
    <h1>read paste</h1>
  </header>

  <div class="stack">
    <div class="bp-field">
      <label class="bp-label" for="pw">Password (empty if none was set)</label>
      <input id="pw" type="password" class="bp-input" placeholder="Password" autocomplete="off" aria-describedby="pwHelp">
      <p class="bp-help" id="pwHelp">The key is in this link's fragment, which never reached the server. The password is the part only you know.</p>
    </div>
    <button id="go" class="bp-btn" type="button">Decrypt</button>
  </div>

  <div id="body">
    <p class="msg">This link works once and is destroyed on read.</p>
  </div>
</main>

<script>
'use strict';

// The paste id is in the query string (sent to the server).
// The key is in the fragment (never sent to the server).
const id = location.search.slice(1);
const frag = decodeURIComponent(location.hash.slice(1));

const $ = (x) => document.getElementById(x);

function b64uToBytes(s) {
  const b64 = s.replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64 + '='.repeat((4 - b64.length % 4) % 4));
  const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
}

function show(text, cls) {
  const p = document.createElement('p');
  p.className = cls;
  p.textContent = text;
  const b = $('body');
  b.innerHTML = '';
  b.appendChild(p);
}

function makeSpinner() {
  const sp = document.createElement('span');
  sp.className = 'bp-spinner';
  sp.setAttribute('aria-hidden', 'true');
  return sp;
}

async function decrypt() {
  const btn = $('go');
  if (!id || !frag) { show('Malformed link: missing id or key.', 'err'); return; }

  btn.disabled = true;
  btn.setAttribute('aria-busy', 'true');
  btn.textContent = 'Decrypting';
  btn.prepend(makeSpinner());

  let d;
  try {
    const r = await fetch('/api/paste/' + id);
    if (!r.ok) { show('Link not found, expired, or already read.', 'err'); return; }
    d = await r.json();
  } catch {
    show('Network error.', 'err');
    return;
  }

  const password = $('pw').value;

  try {
    const enc = new TextEncoder();
    const keyBytes = b64uToBytes(frag);
    const salt = b64uToBytes(d.salt);
    // Same construction as the sender: random bytes ++ password.
    const material = new Uint8Array(keyBytes.length + password.length);
    material.set(keyBytes, 0);
    material.set(enc.encode(password), keyBytes.length);

    const km = await crypto.subtle.importKey('raw', material, 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt, iterations:d.iterations, hash:'SHA-256' },
      km, { name:'AES-GCM', length:256 }, false, ['decrypt']);

    // AES-GCM authenticates: a wrong password or a tampered id fails here.
    const pt = await crypto.subtle.decrypt(
      { name:'AES-GCM', iv:b64uToBytes(d.iv), additionalData:b64uToBytes(d.adata) },
      key, b64uToBytes(d.ct));

    const plaintext = new TextDecoder().decode(pt);

    const pre = document.createElement('pre');
    pre.textContent = plaintext;   // textContent: every newline survives

    const copy = document.createElement('button');
    copy.className = 'bp-btn bp-btn--ghost bp-btn--sm';
    copy.type = 'button';
    copy.textContent = 'Copy';
    copy.onclick = async () => {
      try { await navigator.clipboard.writeText(plaintext); }
      catch {
        const ta = document.createElement('textarea');
        ta.value = plaintext;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      copy.textContent = 'Copied';
      setTimeout(() => { copy.textContent = 'Copy'; }, 1400);
    };

    const wrap = document.createElement('div');
    wrap.className = 'actions';
    wrap.appendChild(copy);

    const b = $('body');
    b.innerHTML = '';
    b.appendChild(pre);
    b.appendChild(wrap);
  } catch {
    show('Wrong password or corrupted content.', 'err');
  } finally {
    btn.disabled = false;
    btn.removeAttribute('aria-busy');
    btn.textContent = 'Decrypt';
    const sp = btn.querySelector('.bp-spinner');
    if (sp) sp.remove();
  }
}

$('go').onclick = decrypt;
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') decrypt(); });
$('pw').focus();
</script>
</body>
</html>
