<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>khepri</title>
<style>
  :root { --bg:#12181f; --fg:#d5dbe1; --acc:#4da3a3; --bd:#2a343f; }
  body { background:var(--bg); color:var(--fg); font:14px/1.5 system-ui,sans-serif;
         margin:0; display:flex; justify-content:center; padding:32px 16px; }
  main { width:100%; max-width:680px; }
  h1 { font-size:18px; margin:0 0 16px; color:var(--acc); }
  textarea { width:100%; height:280px; background:#0d1218; color:var(--fg);
             border:1px solid var(--bd); border-radius:4px; padding:10px;
             font:13px/1.5 ui-monospace,monospace; resize:vertical; }
  button { background:var(--acc); color:#0d1218; border:0; border-radius:4px;
           padding:9px 18px; font-size:14px; cursor:pointer; margin-top:10px; }
  button:hover { filter:brightness(1.1); }
  #out { margin-top:16px; padding:12px; background:#0d1218; border:1px solid var(--bd);
         border-radius:4px; display:none; word-break:break-all; }
  #out a { color:var(--acc); }
  .hint { color:#7d8a96; font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<main>
  <h1>khepri &middot; encrypted paste</h1>
  <textarea id="t" placeholder="Paste text, a command or a script. Newlines are preserved exactly."></textarea>
  <button id="go">Encrypt &amp; create link</button>
  <div id="out"></div>
  <p class="hint">Content is encrypted in your browser. The server stores ciphertext only. Each link works once.</p>
</main>
<script>
const $ = (id) => document.getElementById(id);

async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:150000, hash:'SHA-256' },
    km, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}

$('go').onclick = async () => {
  const text = $('t').value;
  if (!text) return;
  const pw = sessionStorage.getItem('khepri_pw');
  const password = pw || prompt('Set a password to read this paste:');
  if (!password) return;
  sessionStorage.setItem('khepri_pw', password);

  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  // encrypt() takes the raw string — newlines pass through untouched.
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(text));

  const b64 = (b) => btoa(String.fromCharCode(...new Uint8Array(b)));
  const r = await fetch('/api/paste', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ ct:b64(ct), iv:b64(iv), salt:b64(salt) })
  });
  const j = await r.json();
  if (j.code) {
    const url = location.origin + '/' + j.code;
    $('out').style.display = 'block';
    $('out').innerHTML = '<a href="'+url+'" target="_blank">'+url+'</a>';
  } else {
    alert(j.error || 'failed');
  }
};
</script>
</body>
</html>
