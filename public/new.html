<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New paste</title>
<style>
  :root {
    color-scheme: light;
    --canvas: #f2f3f0;
    --paper: #fff;
    --ink: #182435;
    --muted: #546477;
    --line: #d8dfe5;
    --control: #8593a3;
    --accent: #214fb8;
    --accent-hover: #183e97;
    --tint: #eff4ff;
    --editor: #18263b;
    --editor-edge: #354962;
    --editor-text: #f2f6fc;
    --editor-muted: #aabbd0;
    --danger: #9c3032;
    --warning: #79501a;
    --mono: ui-monospace, Consolas, monospace;
  }
  html { overflow-y: scroll; }
  @supports (scrollbar-gutter: stable) {
    html { overflow-y: auto; scrollbar-gutter: stable; }
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font: 1rem/1.55 system-ui, sans-serif; }
  main { width: min(calc(100% - 48px), 56rem); margin: clamp(36px, 7vh, 80px) auto 40px; }
  .masthead { margin-bottom: 28px; }
  h1 { margin: 0; font-size: clamp(2.25rem, 5vw, 3.25rem); font-weight: 650; letter-spacing: -.04em; line-height: 1.08; }
  .masthead p { max-width: 48ch; margin: 10px 0 0; color: var(--muted); }
  .panel { min-width: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 12px 32px -24px #18243566; }
  button, input, select, textarea { font: inherit; }
  :where(button, input, select, textarea, a, summary):focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  a { color: var(--accent); text-underline-offset: .18em; }
  .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 16px; border: 1px solid transparent; border-radius: 8px; background: var(--accent); color: var(--paper); font-size: .875rem; font-weight: 650; text-decoration: none; white-space: nowrap; cursor: pointer; }
  .button:hover:not(:disabled) { background: var(--accent-hover); }
  .button.secondary { border-color: var(--control); background: var(--paper); color: var(--ink); }
  .button.secondary:hover:not(:disabled) { background: var(--tint); }
  .button:disabled { opacity: .75; cursor: wait; }
  .bp-spinner { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }
  .field { display: grid; gap: 6px; min-width: 0; }
  .field > label { font-size: .875rem; font-weight: 650; }
  .optional { color: var(--muted); font-weight: 400; }
  .input { width: 100%; min-height: 44px; padding: 8px 10px; border: 1px solid var(--control); border-radius: 8px; background: var(--paper); color: var(--ink); }
  ::placeholder { color: var(--muted); opacity: 1; }
  .note { margin: 0; font-size: .875rem; color: var(--muted); }
  .note--warn { color: var(--warning); }
  .err { margin: 0; color: var(--danger); }
  @media (max-width: 40rem) {
    main { width: calc(100% - 32px); margin-top: 32px; }
    .masthead { margin-bottom: 22px; }
  }
  @media (prefers-reduced-motion: reduce) { .bp-spinner { animation: none; } }

  .workbench { display: grid; grid-template-columns: minmax(0, 1fr) minmax(16rem, .52fr); align-items: stretch; }
  .editor { display: grid; grid-template-rows: auto 1fr; min-width: 0; padding: 16px 20px 20px; border-radius: 15px 0 0 15px; background: var(--editor); color: var(--editor-text); }
  .editor > label { width: fit-content; padding: 0 0 12px; font-size: .875rem; font-weight: 650; }
  .editor-source { display: grid; grid-template-columns: calc(20px + var(--line-digits, 1) * 1ch) minmax(0, 1fr); border: 1px solid var(--editor-edge); border-radius: 8px; font: .9375rem/1.65 var(--mono); }
  .line-numbers { position: relative; overflow: hidden; border-right: 1px solid var(--editor-edge); color: var(--editor-muted); text-align: right; user-select: none; }
  .line-numbers pre { position: absolute; inset: 0 8px auto 0; margin: 0; padding-top: 14px; font: inherit; white-space: pre; }
  .editor textarea { width: 100%; min-height: 16rem; resize: vertical; padding: 14px; border: 0; border-radius: 0 7px 7px 0; background: transparent; color: inherit; color-scheme: dark; font: inherit; white-space: pre; tab-size: 4; }
  .editor textarea::placeholder { color: var(--editor-muted); }
  .editor textarea:focus-visible { outline-color: var(--editor-muted); }
  .settings { display: grid; align-content: start; gap: 16px; min-width: 0; padding: 20px; }
  .settings h2 { margin: 0; font-size: 1.0625rem; letter-spacing: -.01em; }
  .checks { display: grid; gap: 2px; margin: 0; padding: 8px 0 0; border: 0; border-top: 1px solid var(--line); }
  .checks label { display: flex; align-items: center; gap: 8px; min-height: 32px; font-size: .875rem; cursor: pointer; }
  .checks input { flex: none; width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
  .settings .button { justify-self: start; }
  .page-footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 20px; margin-top: 14px; }
  .privacy { flex: 1 1 24rem; max-width: 70ch; }
  .source-link { color: var(--muted); }
  #createError:not(:empty) { margin-top: 12px; }
  #out { margin-top: 24px; padding: 20px; }
  #shortState:not(:empty), #shortNote:not(:empty) { margin: 12px 0 0; }
  .result-main { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 20px; min-width: 0; }
  .result-main > div:first-child { flex: 1 1 12rem; min-width: 0; }
  .result-main h2 { margin: 0 0 4px; font-size: .875rem; }
  #shortOrigin { margin: 0; font: .8125rem/1.5 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
  .code { margin: 0; color: var(--accent); font: 650 clamp(1.75rem, 6vw, 2.25rem)/1.15 var(--mono); letter-spacing: .035em; font-variant-numeric: slashed-zero; overflow-wrap: anywhere; }
  .code.long { font: .875rem/1.5 var(--mono); letter-spacing: normal; }
  .result-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  details { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
  summary { width: fit-content; color: var(--muted); font-size: .875rem; cursor: pointer; }
  .advanced { margin: 0; padding: 0; border: 0; }
  .advanced summary { min-height: 32px; line-height: 32px; }
  .advanced summary:hover { color: var(--ink); }
  .advanced .field { max-width: 12rem; margin-top: 8px; }
  .link-row { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  .link-row a { flex: 1; min-width: 0; font: .8125rem/1.5 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 40rem) {
    .workbench { grid-template-columns: minmax(0, 1fr); }
    .editor { padding: 14px; border-radius: 15px 15px 0 0; }
    .editor textarea { min-height: 10rem; }
    .settings { padding: 16px; }
    #out { padding: 16px; }
  }
</style>
</head>
<body>
<main>
  <header class="masthead">
    <h1>New paste</h1>
    <p>Share text or code using an encrypted link.</p>
  </header>

  <div class="workbench panel">
    <div class="editor">
      <label for="t">Paste content</label>
      <div class="editor-source">
        <div class="line-numbers" aria-hidden="true"><pre id="editorNumbers">1</pre></div>
        <textarea id="t" wrap="off" spellcheck="false" placeholder="Paste text, commands, or a script"></textarea>
      </div>
    </div>

    <section class="settings" aria-labelledby="settingsTitle">
      <h2 id="settingsTitle">Share settings</h2>
      <div class="field">
        <label for="pw">Password <span class="optional">(optional)</span></label>
        <input id="pw" class="input" type="password" placeholder="Leave blank for no password" autocomplete="new-password">
      </div>
      <fieldset class="checks" aria-label="Reading restrictions">
        <label><input type="checkbox" id="burn" checked> Burn after reading</label>
        <label><input type="checkbox" id="pin"> Lock to the first reader's IP</label>
      </fieldset>
      <button id="go" class="button" type="button">Create link</button>
      <details class="advanced">
        <summary>Advanced options</summary>
        <div class="field">
          <label for="len">Short code length</label>
          <select id="len" class="input">
            <option value="3">3 characters</option>
            <option value="4" selected>4 characters</option>
            <option value="5">5 characters</option>
            <option value="6">6 characters</option>
            <option value="7">7 characters</option>
            <option value="8">8 characters</option>
          </select>
        </div>
      </details>
    </section>
  </div>
  <p id="createError" class="note err" role="alert"></p>

  <section id="out" class="panel" aria-labelledby="plateCap" hidden>
    <div class="result-main">
      <div>
        <h2 id="plateCap">Paste link</h2>
        <p id="shortOrigin" hidden></p>
        <p class="code" id="mainCode"></p>
      </div>
      <div class="result-actions">
        <a id="openUrl" class="button secondary" href="#" target="_blank" rel="noreferrer">Open</a>
        <button id="copyMain" class="button" type="button">Copy link</button>
      </div>
    </div>
    <p id="shortState" class="note" role="status"></p>
    <p id="shortNote" class="note"></p>
    <details id="longWrap" hidden>
      <summary>Full link</summary>
      <div class="link-row">
        <a id="longUrl" href="#" target="_blank" rel="noreferrer"></a>
        <button id="copyLong" class="button secondary" type="button">Copy full link</button>
      </div>
    </details>
  </section>
  <footer class="page-footer note">
    <p class="privacy note">Your browser encrypts the paste before upload. The shortener receives the link key, but never your password.</p>
    <a class="source-link" href="https://github.com/Yuchenhui/khepri-secure-paste" target="_blank" rel="noreferrer">Source on GitHub</a>
  </footer>
</main>

<script>
'use strict';

const $ = (id) => document.getElementById(id);
const ITERATIONS = 200000;
const SHORTENER = '__SHORTENER__';

const editor = $('t');
const editorNumbers = $('editorNumbers');
let editorLineCount = 1;

function syncLineScroll() {
  editorNumbers.style.transform = `translateY(${-editor.scrollTop}px)`;
}

function updateLineNumbers() {
  const count = editor.value.split('\n').length;
  if (count !== editorLineCount) {
    editorLineCount = count;
    editor.parentElement.style.setProperty('--line-digits', String(count).length);
    editorNumbers.textContent = Array.from({ length: count }, (_, i) => i + 1).join('\n');
  }
  syncLineScroll();
}

editor.addEventListener('input', updateLineNumbers);
editor.addEventListener('scroll', syncLineScroll);
window.addEventListener('pageshow', updateLineNumbers);

function b64u(buf) {
  const bytes = new Uint8Array(buf);
  let raw = '';
  for (let i = 0; i < bytes.length; i += 0x8000) {
    raw += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  }
  return btoa(raw).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function deriveKey(password, salt, keyBytes) {
  const passwordBytes = new TextEncoder().encode(password);
  // PrivateBin construction: random key bytes with the password appended.
  const material = new Uint8Array(keyBytes.length + passwordBytes.length);
  material.set(keyBytes, 0);
  material.set(passwordBytes, keyBytes.length);
  const km = await crypto.subtle.importKey('raw', material, 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:ITERATIONS, hash:'SHA-256' },
    km, { name:'AES-GCM', length:256 }, false, ['encrypt']);
}

function setMain(href, code) {
  $('openUrl').href = href;
  $('mainCode').textContent = code || href;
  $('mainCode').classList.toggle('long', !code);
  $('shortOrigin').textContent = code ? href.slice(0, -code.length) : '';
  $('shortOrigin').hidden = !code;
  $('longWrap').hidden = !code;
  $('plateCap').textContent = code ? 'Short code' : 'Paste link';
}

function setState(text, isError) {
  const el = $('shortState');
  el.textContent = text;
  el.classList.toggle('err', Boolean(isError));
}

function setNote(text, isWarn) {
  const el = $('shortNote');
  el.textContent = text;
  el.className = text ? (isWarn ? 'note note--warn' : 'note') : '';
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
}

function wireCopy(btnId, getText) {
  $(btnId).onclick = async () => {
    const btn = $(btnId);
    await copyText(getText());
    const label = btnId === 'copyMain' ? 'Copy link' : 'Copy full link';
    clearTimeout(btn.copyTimer);
    btn.textContent = 'Copied';
    btn.copyTimer = setTimeout(() => { btn.textContent = label; }, 1400);
  };
}

wireCopy('copyMain', () => $('openUrl').href);
wireCopy('copyLong', () => $('longUrl').href);

async function shorten(longUrl, len) {
  const r = await fetch(SHORTENER + '/shorten', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ url: longUrl, len }),
  });
  const body = await r.text();
  if (!r.ok) throw new Error('HTTP ' + r.status + (body ? ' — ' + body.trim() : ''));
  return body.trim();
}

$('go').onclick = async () => {
  const btn = $('go');
  const text = $('t').value;
  if (!text) { $('t').focus(); return; }

  btn.disabled = true;
  btn.setAttribute('aria-busy', 'true');
  btn.textContent = 'Encrypting';
  btn.prepend(makeSpinner());
  $('out').hidden = true;
  $('longWrap').open = false;
  $('createError').textContent = '';
  setState('');
  setNote('');

  try {
    const id = [...crypto.getRandomValues(new Uint8Array(8))]
      .map(b => b.toString(16).padStart(2, '0')).join('');
    const keyBytes = crypto.getRandomValues(new Uint8Array(32));
    const salt = crypto.getRandomValues(new Uint8Array(8));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const password = $('pw').value;

    const key = await deriveKey(password, salt, keyBytes);
    const enc = new TextEncoder();
    const ct = await crypto.subtle.encrypt(
      { name: 'AES-GCM', iv, additionalData: enc.encode(id) }, key, enc.encode(text));

    // The reader decrypts this token before the server releases the body.
    const proof = crypto.getRandomValues(new Uint8Array(32));
    const claimIv = crypto.getRandomValues(new Uint8Array(12));
    const claim = await crypto.subtle.encrypt(
      { name: 'AES-GCM', iv: claimIv, additionalData: enc.encode('claim:' + id) }, key, proof);
    const claimHash = await crypto.subtle.digest('SHA-256', proof);

    const r = await fetch('/api/paste', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        id, ct:b64u(ct), iv:b64u(iv), salt:b64u(salt),
        claim: b64u(claim), claimIv: b64u(claimIv), claimHash: b64u(claimHash), iterations: ITERATIONS,
        burn:$('burn').checked, pinIp:$('pin').checked,
      })
    });
    const j = await r.json();
    if (j.error) throw new Error(j.error);

    const longUrl = location.origin + '/?' + id + '#' + b64u(keyBytes);
    $('longUrl').href = longUrl;
    $('longUrl').textContent = longUrl;
    $('longUrl').title = longUrl;

    setMain(longUrl);
    $('out').hidden = false;

    if (!SHORTENER) return;

    setState('Shortening');
    try {
      const len = Number($('len').value);
      const short = await shorten(longUrl, len);
      setMain(short, new URL(short).pathname.split('/').pop());
      setState('');
      if (!password) {
        setNote('No password set: the shortener holds the key from this link. Set a password if the content matters.', true);
      }
    } catch (e) {
      setState('Shorten failed — using the long link. ' + e.message, true);
    }
  } catch (e) {
    $('createError').textContent = 'Could not create the paste: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.removeAttribute('aria-busy');
    btn.textContent = 'Create link';
  }
};

function makeSpinner() {
  const sp = document.createElement('span');
  sp.className = 'bp-spinner';
  sp.setAttribute('aria-hidden', 'true');
  return sp;
}
</script>
</body>
</html>
