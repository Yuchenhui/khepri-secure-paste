<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>khepri &middot; new paste</title>
<style>
  :root {
    --bg:      #0f1419;
    --surface: #161d24;
    --sunk:    #101720;
    --border:  #232d36;
    --fg:      #e6edf3;
    --muted:   #8b98a5;
    --accent:  #4fd1c5;
    --danger:  #e57373;

    --s1: 4px;  --s2: 8px;  --s3: 12px;
    --s4: 16px; --s5: 24px; --s6: 32px;
    --r: 6px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: var(--s6) var(--s4);
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  main { width: 100%; max-width: 42rem; }

  h1 {
    margin: 0 0 var(--s5);
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--fg);
  }
  h1 .dot { color: var(--accent); }

  /* ---------- fields ---------- */
  .field { margin-bottom: var(--s4); }

  .field > label {
    display: block;
    margin-bottom: var(--s2);
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
  }

  textarea, input[type=text], input[type=password] {
    width: 100%;
    padding: var(--s3);
    background: var(--sunk);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: var(--r);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
    transition: border-color 120ms ease;
  }
  textarea { height: 15rem; resize: vertical; }

  textarea::placeholder,
  input::placeholder { color: #5c6a76; }

  textarea:hover, input:hover { border-color: #2e3a45; }

  textarea:focus-visible,
  input:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79, 209, 197, 0.14);
  }

  /* ---------- checkboxes ---------- */
  .checks {
    display: flex;
    flex-direction: column;
    gap: var(--s3);
    margin-bottom: var(--s5);
  }

  .check {
    display: flex;
    align-items: center;
    gap: var(--s2);
    font-size: 13px;
    color: var(--fg);
    cursor: pointer;
    user-select: none;
  }

  .check input { position: absolute; opacity: 0; width: 0; height: 0; }

  .box {
    flex: none;
    width: 16px;
    height: 16px;
    border: 1px solid #34414d;
    border-radius: 4px;
    background: var(--sunk);
    display: grid;
    place-items: center;
    transition: border-color 120ms ease, background-color 120ms ease;
  }
  .box svg { width: 11px; height: 11px; stroke: var(--bg); stroke-width: 2.6;
             fill: none; stroke-linecap: round; stroke-linejoin: round;
             opacity: 0; transform: scale(0.6);
             transition: opacity 100ms ease, transform 100ms ease; }

  .check:hover .box { border-color: var(--accent); }

  .check input:checked + .box { background: var(--accent); border-color: var(--accent); }
  .check input:checked + .box svg { opacity: 1; transform: scale(1); }

  .check input:focus-visible + .box {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79, 209, 197, 0.14);
  }

  /* ---------- buttons ---------- */
  button {
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    padding: 9px var(--s4);
    border: 0;
    border-radius: var(--r);
    cursor: pointer;
    transition: filter 120ms ease, opacity 120ms ease;
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:active:not(:disabled) { filter: brightness(0.94); }
  button:disabled { opacity: 0.55; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .primary { background: var(--accent); color: #0b1116; }
  .ghost {
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--border);
  }
  .ghost:hover:not(:disabled) { border-color: #34414d; filter: none; background: var(--surface); }

  /* ---------- result ---------- */
  #out {
    margin-top: var(--s5);
    padding: var(--s4);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    display: none;
  }
  #out.show { display: block; }

  .out-row { margin-bottom: var(--s4); }
  .out-row:last-child { margin-bottom: 0; }

  .out-row .cap {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: var(--s2);
  }

  .url {
    display: flex;
    align-items: center;
    gap: var(--s2);
    font-family: var(--mono);
    font-size: 13px;
  }
  .url a {
    color: var(--accent);
    text-decoration: none;
    word-break: break-all;
    flex: 1;
  }
  .url a:hover { text-decoration: underline; text-underline-offset: 3px; }

  .copy {
    flex: none;
    font-size: 12px;
    padding: 5px 10px;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .copy:hover { color: var(--fg); }

  #shortRow { display: none; }
  #shortRow.show { display: block; }

  #shortStatus { font-size: 12px; color: var(--muted); margin-top: var(--s2); }
  #shortStatus.err { color: var(--danger); }

  /* ---------- footnote ---------- */
  .hint {
    margin: var(--s6) 0 0;
    font-size: 12px;
    line-height: 1.7;
    color: var(--muted);
    max-width: 62ch;
  }

  @media (max-width: 480px) {
    body { padding: var(--s5) var(--s3); }
    textarea { height: 11rem; }
  }
</style>
</head>
<body>
<main>
  <h1>khepri <span class="dot">&middot;</span> new paste</h1>

  <div class="field">
    <label for="t">Content</label>
    <textarea id="t" placeholder="Text, command or script. Newlines are preserved exactly."></textarea>
  </div>

  <div class="field">
    <label for="pw">Password (optional)</label>
    <input id="pw" type="text" placeholder="Leave empty for none" autocomplete="off">
  </div>

  <div class="checks">
    <label class="check">
      <input type="checkbox" id="burn" checked>
      <span class="box"><svg viewBox="0 0 12 12"><path d="M2 6.5 4.6 9 10 3.5"/></svg></span>
      Burn after reading
    </label>
    <label class="check">
      <input type="checkbox" id="pin">
      <span class="box"><svg viewBox="0 0 12 12"><path d="M2 6.5 4.6 9 10 3.5"/></svg></span>
      Lock to the first reader's IP
    </label>
  </div>

  <button id="go" class="primary">Create</button>

  <div id="out">
    <div class="out-row">
      <div class="cap">Long link</div>
      <div class="url">
        <a id="longUrl" href="#" target="_blank"></a>
        <button class="copy" id="copyLong">Copy</button>
      </div>
    </div>

    <div class="out-row" id="shortRow">
      <div class="cap">Short link</div>
      <div class="url">
        <a id="shortUrl" href="#" target="_blank"></a>
        <button class="copy" id="copyShort">Copy</button>
      </div>
      <div id="shortStatus"></div>
    </div>
  </div>

  <p class="hint">
    The link is long because it carries a 256-bit random key in its fragment.
    The fragment is never sent to the server, which stores ciphertext only.
    A password adds a second secret the server never sees.
  </p>
</main>

<script>
'use strict';

const $ = (id) => document.getElementById(id);
const ITERATIONS = 200000;   // PBKDF2-SHA256
const SHORTENER = '__SHORTENER__';

function b64u(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function deriveKey(password, salt, keyBytes) {
  const enc = new TextEncoder();
  // PrivateBin construction: random key bytes with the password appended.
  const material = new Uint8Array(keyBytes.length + password.length);
  material.set(keyBytes, 0);
  material.set(enc.encode(password), keyBytes.length);
  const km = await crypto.subtle.importKey('raw', material, 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:ITERATIONS, hash:'SHA-256' },
    km, { name:'AES-GCM', length:256 }, false, ['encrypt']);
}

function setStatus(text, isError) {
  const el = $('shortStatus');
  el.textContent = text;              // textContent: never rebuilds siblings
  el.className = isError ? 'err' : '';
}

function wireCopy(btnId, getUrl) {
  $(btnId).onclick = async () => {
    const btn = $(btnId);
    const url = getUrl();
    try {
      await navigator.clipboard.writeText(url);
    } catch {
      // clipboard API needs a secure context; fall back to a temp selection
      const ta = document.createElement('textarea');
      ta.value = url;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    const prev = btn.textContent;
    btn.textContent = 'Copied';
    setTimeout(() => { btn.textContent = prev; }, 1400);
  };
}

wireCopy('copyLong',  () => $('longUrl').href);
wireCopy('copyShort', () => $('shortUrl').href);

async function shorten(longUrl) {
  const r = await fetch(SHORTENER + '/shorten?url=' + encodeURIComponent(longUrl));
  const body = await r.text();
  if (!r.ok) throw new Error('HTTP ' + r.status + (body ? ' — ' + body.trim() : ''));
  return body.trim();
}

$('go').onclick = async () => {
  const btn = $('go');
  const text = $('t').value;
  if (!text) { $('t').focus(); return; }

  btn.disabled = true;
  btn.textContent = 'Encrypting…';

  try {
    const id = [...crypto.getRandomValues(new Uint8Array(8))]
      .map(b => b.toString(16).padStart(2, '0')).join('');
    const keyBytes = crypto.getRandomValues(new Uint8Array(32));
    const salt = crypto.getRandomValues(new Uint8Array(8));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const password = $('pw').value;

    const key = await deriveKey(password, salt, keyBytes);
    const adata = new TextEncoder().encode(id);
    const ct = await crypto.subtle.encrypt(
      { name:'AES-GCM', iv, additionalData: adata }, key, new TextEncoder().encode(text));

    const r = await fetch('/api/paste', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        id, ct:b64u(ct), iv:b64u(iv), salt:b64u(salt),
        adata:b64u(adata), iterations:ITERATIONS,
        burn:$('burn').checked, pinIp:$('pin').checked,
      })
    });
    const j = await r.json();
    if (j.error) throw new Error(j.error);

    const longUrl = location.origin + '/?' + id + '#' + b64u(keyBytes);
    $('longUrl').href = longUrl;
    $('longUrl').textContent = longUrl;
    $('out').classList.add('show');

    if (!SHORTENER) return;

    // The Shorten button is built once and never re-created. Its label is
    // updated through this closure only — never via innerHTML, which would
    // replace the node out from under it and freeze the label.
    const shortRow = $('shortRow');
    const btn = document.createElement('button');
    btn.className = 'ghost';
    btn.textContent = 'Shorten';
    btn.onclick = async () => {
      btn.disabled = true;
      btn.textContent = 'Shortening…';
      setStatus('');
      try {
        const short = await shorten(longUrl);
        $('shortUrl').href = short;
        $('shortUrl').textContent = short;
        shortRow.classList.add('show');
        setStatus('');
      } catch (e) {
        shortRow.classList.remove('show');
        setStatus('Shorten failed: ' + e.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Shorten';
      }
    };
    const holder = document.createElement('div');
    holder.style.marginTop = '12px';
    holder.appendChild(btn);
    shortRow.parentNode.insertBefore(holder, shortRow);
  } catch (e) {
    setStatus('Create failed: ' + e.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Create';
  }
};
</script>
</body>
</html>
