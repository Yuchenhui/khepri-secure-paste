# Per-client ceilings. These zone declarations sit at the top of the file
# because sites-enabled files are included from nginx's http block. The app
# already rate limits at 60 req/min/IP; this layer survives a burst before
# Node sees it and caps concurrent sockets so a slow reader cannot hold many
# connections open.
limit_req_zone $binary_remote_addr zone=paste_req:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=paste_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# Reused upstream connections: bounded file descriptors on both sides instead
# of one socket per request reaching Node.
upstream paste_core {
    server 127.0.0.1:18901;
    keepalive 32;
}

upstream paste_short {
    server 127.0.0.1:18902;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/paste-acme;
        try_files $uri =404;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # No session tickets: the key never leaves memory, and tickets make
    # captured traffic decryptable if the ticket key leaks.
    ssl_session_tickets off;
    ssl_session_cache   shared:paste_ssl:5m;
    ssl_session_timeout 1d;

    # No websockets, no webrtc, no compression. The payload is already
    # encrypted and small.
    access_log off;

    # core.js caps a paste body at 1 MiB. Match it here so an oversized
    # request is rejected by the app with a readable error rather than by
    # nginx with a bare 413.
    client_max_body_size 1m;

    # Nothing here streams or long-polls: a slow client gains nothing by
    # keeping a socket open, so time it out instead of letting it park.
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;

    # The app already sends Referrer-Policy and X-Content-Type-Options; these
    # are the headers it cannot set usefully from behind a proxy.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Paste URLs are secrets; keep them out of search indexes and out of other
    # sites' <img>/<script> tags, which could otherwise probe a link or leak
    # timing through a cached response.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # The pages are one inline script and one inline stylesheet, and fetch only
    # their own origin. The vendored QR encoder is same-origin too. No eval, no
    # external hosts, no framing.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # The app answers 404 to anything else; reject odd verbs before the proxy.
    if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) {
        return 405;
    }

    # No server-side caching of paste data, ever.
    proxy_no_cache 1;
    expires off;

    # Strip /s/ before forwarding. The POST body and Location can contain the link key.
    location ^~ /s/ {
        access_log off;
        error_log /dev/null crit;
        client_max_body_size 1k;
        limit_req zone=paste_req burst=20 nodelay;
        limit_conn paste_conn 8;
        proxy_pass http://paste_short/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_redirect off;
    }

    location / {
        proxy_pass http://paste_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # $remote_addr, NOT $proxy_add_x_forwarded_for. Appending lets a
        # client send its own X-Forwarded-For and forge the address that
        # IP pinning binds to. Overwriting means only nginx's view counts.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        limit_req zone=paste_req burst=40 nodelay;
        limit_conn paste_conn 16;
    }
}
