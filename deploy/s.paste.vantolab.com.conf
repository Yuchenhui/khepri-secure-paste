server {
    listen 80;
    listen [::]:80;
    server_name s.__DOMAIN__;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/s-paste-acme;
        try_files $uri =404;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name s.__DOMAIN__;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/s.__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/s.__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The shortener never serves content, only 302s. No logging of URLs,
    # because the Location header contains a cipher key.
    access_log off;
    client_max_body_size 1k;

    # Only the two endpoints the browser actually calls. Everything else is
    # 404 rather than falling through to the app.
    location = /shorten {
        proxy_pass http://127.0.0.1:18902;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # CORS: the paste core calls this cross-origin from the browser.
        # Only that exact origin is allowed, and only for GET.
        add_header Access-Control-Allow-Origin "https://__DOMAIN__" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary Origin always;
    }

    location = /health {
        proxy_pass http://127.0.0.1:18902;
        proxy_set_header Host $host;
    }

    # Redirect resolution. Note: no access_log, since Location carries a key.
    location / {
        proxy_pass http://127.0.0.1:18902;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
}
