server {
    listen 80;
    listen [::]:80;
    server_name __SHORT__;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/s-paste-acme;
        try_files $uri =404;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __SHORT__;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/__SHORT__/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/__SHORT__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Shortening requests and redirect targets can contain decryption keys.
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 1k;

    # CORS is emitted by the application, not duplicated by nginx.
    location = /shorten {
        proxy_pass http://127.0.0.1:18902;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_redirect off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:18902;
        proxy_set_header Host $host;
    }

    # Redirect resolution. Note: no access_log, since Location carries a key.
    location / {
        proxy_pass http://127.0.0.1:18902;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_redirect off;
        proxy_read_timeout 30s;
    }
}
